spring:
  application:
    name: springSecurityCompliteProject
  #  profiles:
  #     active:

  datasource:
    url: jdbc:mysql://localhost:3306/SpringSecurityCompliteProject
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root123
    hikari:
      pool-name: database pool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 6000000
      idle-timeout: 30000
      max-lifetime: 1800000

  jpa:
    hibernate:
      dialect: org.hibernate.dialect.MySQLDialect
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

    open-in-view: true